services:
  - type: web
    name: wind-intelligence-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1

